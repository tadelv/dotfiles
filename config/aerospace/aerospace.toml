#

# [key-mapping.modifiers]
# alt = "option"

start-at-login = true

after-startup-command = ['exec-and-forget sketchybar --reload']

# Notify sketchybar on workspace change
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

#
# Use alt as main modifier
[mode.main.binding]

# focus windows (vim-style to keep alt+arrows free for macOS word movement)
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"

# move windows
alt-shift-h = "move left"
alt-shift-j = "move down"
alt-shift-k = "move up"
alt-shift-l = "move right"

# resize
alt-minus = "resize smart -50"
alt-equal = "resize smart +50"

# splits
alt-v = "join-with left"
alt-b = "join-with up"

# fullscreen
alt-f = "fullscreen"

# floating toggle
alt-shift-space = "layout floating tiling"

# close window
alt-q = "close"

# Workspace switching (1-9 for numpad)
ctrl-alt-1 = "workspace 1"
ctrl-alt-2 = "workspace 2"
ctrl-alt-3 = "workspace 3"
ctrl-alt-4 = "workspace 4"
ctrl-alt-5 = "workspace 5"
ctrl-alt-6 = "workspace 6"
ctrl-alt-7 = "workspace 7"
ctrl-alt-8 = "workspace 8"
ctrl-alt-9 = "workspace 9"

# move window to workspace
ctrl-alt-shift-1 = "move-node-to-workspace 1"
ctrl-alt-shift-2 = "move-node-to-workspace 2"
ctrl-alt-shift-3 = "move-node-to-workspace 3"
ctrl-alt-shift-4 = "move-node-to-workspace 4"
ctrl-alt-shift-5 = "move-node-to-workspace 5"
ctrl-alt-shift-6 = "move-node-to-workspace 6"
ctrl-alt-shift-7 = "move-node-to-workspace 7"
ctrl-alt-shift-8 = "move-node-to-workspace 8"
ctrl-alt-shift-9 = "move-node-to-workspace 9"

# reset layout
alt-r = "flatten-workspace-tree"

# open terminal
alt-enter = "exec-and-forget open -a Kitty"

[gaps]
# inner.horizontal = 8
# inner.vertical = 8
# outer.left = 8
# outer.bottom = 8
# outer.right = 8
# outer.top = 32
outer.top        = [{ monitor.main = 0 }, { monitor.secondary = 24 }, 0]

[workspace-to-monitor-force-assignment]
# Built-in monitor: 1-4
1 = ['built-in', 'lg']
2 = 'built-in'
3 = 'built-in'
4 = 'built-in'
# LG monitor: 5-9
5 = 'lg'
6 = 'lg'
7 = 'lg'
8 = 'lg'
9 = 'lg'

[[on-window-detected]]
if.app-id = "com.apple.Safari"
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-id = "com.hnc.Discord"
run = "move-node-to-workspace 3"

[[on-window-detected]]
if.app-id = "net.kovidgoyal.kitty"
run = "move-node-to-workspace 5"

[[on-window-detected]]
if.app-id = "com.apple.notes"
run = "move-node-to-workspace 6"

[[on-window-detected]]
if.app-id = "com.apple.MobileSMS"
run = "move-node-to-workspace 4"
